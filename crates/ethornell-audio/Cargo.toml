[package]
name = "ethornell-audio"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
ethornell-core = { path = "../ethornell-core" }
kira.workspace = true
serde.workspace = true
# Not used directly: enables Symphonia's MPEG-1/2 Layer II decoder for kira,
# whose own features stop at MP3. BGI movies carry Layer II soundtracks.
symphonia = { version = "0.5.5", default-features = false, features = ["mp2"] }
