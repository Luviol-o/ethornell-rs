[package]
name = "ethornell-android"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[lib]
name = "ethornell"
crate-type = ["cdylib", "rlib"]

[dependencies]
ethornell-app = { path = "../ethornell-app", default-features = false, features = ["host-driven"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
