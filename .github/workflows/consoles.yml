name: Console builds
on:
  workflow_dispatch:
  push:
    paths: ['crates/**', 'platform/console/**', 'platform/switch/**', 'platform/vita/**', '.github/workflows/consoles.yml', 'Cargo.toml']
  pull_request:
    paths: ['crates/**', 'platform/console/**', 'platform/switch/**', 'platform/vita/**', '.github/workflows/consoles.yml', 'Cargo.toml']
permissions:
  contents: read
jobs:
  switch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: platform/switch/docker
          load: true
          tags: ethornell-switch-build:ci
          cache-from: type=gha,scope=switch
          cache-to: type=gha,mode=max,scope=switch
      - run: docker run --rm -v "$PWD:/src" -w /src ethornell-switch-build:ci make -C platform/switch/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-switch
          path: platform/switch/runtime/ethornell_switch.nro
          if-no-files-found: error
  vita:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: platform/vita/docker
          load: true
          tags: ethornell-vita-build:ci
          cache-from: type=gha,scope=vita
          cache-to: type=gha,mode=max,scope=vita
      - run: docker run --rm -v "$PWD:/src" -w /src/platform/vita/player ethornell-vita-build:ci cargo vita build vpk -- --release
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-vita
          path: platform/vita/player/target/armv7-sony-vita-newlibeabihf/release/ethornell_vita.vpk
          if-no-files-found: error
